; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
lib_deps =
  someweisguy/esp_dmx
  khoih-prog/Ethernet_Generic=https://github.com/khoih-prog/Ethernet_Generic.git
  khoih-prog/EthernetWebServer=https://github.com/khoih-prog/EthernetWebServer.git
  khoih-prog/Functional-Vlpp=https://github.com/khoih-prog/Functional-Vlpp.git